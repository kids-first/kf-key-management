services:
  # === Core infrastructure ===

  dynamodb:
    image: amazon/dynamodb-local:3.3.0
    ports:
      - "8000:8000"

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: kms
    ports:
      - "4566:4566"

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.7
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "18080:8080"
    volumes:
      - ./docker/kf-realm.json:/opt/keycloak/data/import/kf-realm.json:ro

  # === Initialization sidecars ===

  init_dynamodb:
    image: amazon/aws-cli
    depends_on:
      - dynamodb
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      ENDPOINT: http://dynamodb:8000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url $$ENDPOINT >/dev/null 2>&1; do
          echo "Waiting for DynamoDB..."
          sleep 1
        done
        echo "Creating DynamoDB table..."
        aws dynamodb create-table --endpoint-url $$ENDPOINT \
          --table-name kf-key-management-secret \
          --attribute-definitions AttributeName=userId,AttributeType=S AttributeName=service,AttributeType=S \
          --key-schema AttributeName=userId,KeyType=HASH AttributeName=service,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST \
          || true

  init_kms:
    image: amazon/aws-cli
    depends_on:
      - localstack
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      ENDPOINT: http://localstack:4566
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws kms list-keys --endpoint-url $$ENDPOINT >/dev/null 2>&1; do
          echo "Waiting for LocalStack KMS..."
          sleep 1
        done
        echo "Creating KMS key + alias..."
        KEY_ID=$(aws kms create-key --endpoint-url $$ENDPOINT --query KeyMetadata.KeyId --output text)
        aws kms create-alias --endpoint-url $$ENDPOINT \
          --alias-name alias/kf-dev-master \
          --target-key-id $$KEY_ID \
          || true

  # === Application ===

  app:
    build: .
    depends_on:
      keycloak: { condition: service_started }
      init_dynamodb: { condition: service_completed_successfully }
      init_kms: { condition: service_completed_successfully }
    environment:
      SPRING_PROFILES_ACTIVE: dev,localstack
      # iss claim validation — what tokens stamp as "iss" when the user hits Keycloak via localhost:18080
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:18080/realms/kf
      # Actual JWKS fetch URL — reachable from inside the docker network (the iss URL above isn't)
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/kf/protocol/openid-connect/certs
      AWS_DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
      AWS_ACCESSKEY: test
      AWS_SECRETKEY: test
      # KMS via LocalStack (compose-only; prod uses real AWS KMS without endpoint override)
      APPLICATION_KMS: alias/kf-dev-master
      APPLICATION_KMS_ENDPOINT: http://localstack:4566
    ports:
      - "8080:8080"
